name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    # Pinned to an exact tag, not the moving @v1 tag: @v1 has been retired
    # because it drifted patch releases behind while still accepting inputs
    # it did not implement, so a configured input could silently no-op.
    uses: strongo/cicd/.github/workflows/workflow.yml@main

    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

    with:
      # This is a trivial vanity-import-path proof, not a versioned release.
      disable-version-bumping: true
      go_version: '1.27.0'
      min_test_coverage_percent: 100
